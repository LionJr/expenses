# Isolated test database; deliberately separate from the application's volume.
name: expenses-test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: expenses_test
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expenses_test"]
      interval: 1s
      timeout: 3s
      retries: 20
