name: expenses

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: expenses
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d expenses"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    stop_grace_period: 15s
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://expenses@db:5432/expenses?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HTTP_ADDR: :8080
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-}
      PANEL_AUTH_KEY: ${PANEL_AUTH_KEY:?Set a random 64-character hex key in .env}
      PANEL_MASTER_USER_ID: ${PANEL_MASTER_USER_ID:?Set the master's Telegram user ID in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${APP_PORT:-8080}}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:?Set allowed Telegram user IDs in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30s}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      APP_CURRENCY: ${APP_CURRENCY:-TMT}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "6", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 8s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
