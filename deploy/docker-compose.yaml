name: expenses

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: expenses_local
      POSTGRES_DB: expenses
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d expenses"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    stop_grace_period: 15s
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://expenses:expenses_local@db:5432/expenses?sslmode=disable
      HTTP_ADDR: :8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:?Set allowed Telegram user IDs in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30s}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
